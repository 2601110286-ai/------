<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인라인 이벤트 요청</title>
    <script>
        
            function greet() {
                alert('안녕하세요 ~ 인라인 이벤트 모델 2');
            }

            function addStar(btn) {
                btn.textContent += '*';
            }

            function overChange(btn) {
                btn.style.backgroundColor = 'yellow';
                btn.style.color = 'Purple';
            }

            function outChange(btn) {
                btn.style.backgroundColor = 'Purple';
                btn.style.color = 'Yellow';
            }

        
            let count = 1;
            function changeImg(img) {
                count++;
                if(count == 6) {
                    count = 1;
                }
                img.src = "img/과일" + count + ".png";
            }
        
            let count2 = 1;
            function showImageSlide() {
                let img = document.getElementById("img2");
                setInterval(function() {
                    count2++;
                    if(count2 == 6) {
                        count2 = 1;
                    }
                    img.src = "img/과일" + count2 + ".png";
                }, 1000);

                let a1 = document.getElementById("a1");
                a1.onclick = function(event) {
                return false; // a 태그의 디폴트 이벤트 제거
                };
            }


        
    </script>
</head>
<body onload="showImageSlide()">
    <button onclick="alert('인라인 이벤트 모델1')">인라인 이벤트 모델</button><br></br>
    <button onclick="greet()">인라인 이벤트 모델2</button><br></br>
    <button onclick="addStar(this)">별 추가</button><br></br>
    <button onmouseover="overChange(this)" onmouseout="outChange(this)">배경 및 글자색 변경</button><br></br>
    <button onclick="changeImg(document.getElementById('img'))">이미지 변경</button><br></br>
    <img src="img/과일1.png" width="200px" id="img" onclick="changeImg(this)" style="cursor: pointer;"><br></br>
    <img src="img/과일1.png" width="200px" id="img2"><br></br>
    <a href="https://www.naver.com/" id="a1"> 디폴트 이벤트 제거</a>
</body>
</html>
