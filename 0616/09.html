<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(
            function(){
                $("body").css("background", "black");

                $("#box").css({
                    width: "100px",
                    height: "100px",
                    background: "orange",
                    position : "absolute",
                    left : "10px",
                    top : "10px"
                    }
                ).animate({
                    width: "300px",
                    opacity : 0.1
                    }, 2000
                ).animate({
                    width: "-=200px",
                    opacity : 1.0,
                    }, 2000
                );
            }
        );
    </script>
</head>
<body>
    <div id="box"></div>
</body>
</html>
