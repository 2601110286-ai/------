<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    
    <script>
        function changeStyle() {
             document.querySelector("h1").style.backgroundColor = "blue";
             document.querySelector("h2").style.color = "magenta";
        }
    </script>
    
</head>
<body onload = "changeStyle()">
    <h1>DOM</h1>
    <h2>DOM은 문서 객체 모델입니다.</h2>
</body>
</html>
