<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let date = new Date();
        let hours = date.getHours();

        if(hours < 5) {
            alert("새벽임 좀 더 자");
        }
        else{
                if(hours < 7) {
                    alert("아침임 일어나")
                }
                else {
                    if (hours < 9) {
                        alert("오전임 열심히 일해")
                    }
                    else {
                        if (hours < 12) {
                            alert("낮임 점심시간이다")
                        }
                        else {
                            if (hours < 13) {
                                alert("오후임 열심히 일해")
                            }
                            else {
                                if (hours < 18) {
                                    alert("저녁임 퇴근시간이다")
                                }
                                else {
                                    alert("밤임 집에가자")
                                }
                            }
                        }
                    }
                }
            }    
    </script>
</head>

</body>
</html>
