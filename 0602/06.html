<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function callAlert() {
            let input = document.getElementById("input").value;
            alert(input);
        }
    </script>
</head>
<body>
    <!----- <button onclick="callAlert('Hello, World!')">Click Me</button> ----->
    <input type = "text" id = "input" size = "15" placeholder = "Enter text">
    <button onclick="callAlert()">Click Me</button>
</body>

</html>
