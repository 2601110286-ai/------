<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Animation</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function(){

            let clearQueue = false;
            let goToEnd = false;
            let intervalId = null;

            $("#box").css({
                width: 100,
                height: 100,
                backgroundColor: "magenta"
            });

            $("#clearQueue").change(function(){
                clearQueue = $(this).prop("checked");
            });

            $("#goToEnd").change(function(){
                goToEnd = $(this).prop("checked");
            });

            $("#startBtn").click(function(){

                if(intervalId !== null){
                    return;
                }

                intervalId = setInterval(function(){
                    $("#box")
                        .animate({
                            width: "200px"
                        }, 1000)
                        .delay(1000)
                        .animate({
                            width: "100px"
                        }, 1000);
                }, 3000);

            });

            $("#stopBtn").click(function(){
                clearInterval(intervalId);
                intervalId = null;

                $("#box").stop(clearQueue, goToEnd);
            });

        });
    </script>
</head>
<body>
    <label>clearQueue</label>
    <input type="checkbox" id="clearQueue">
    <br>

    <label>goToEnd</label>
    <input type="checkbox" id="goToEnd">
    <br>

    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop</button>

    <div id="box"></div>
</body>
</html>
